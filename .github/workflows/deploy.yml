name: Deploy Garap Backend

on:
  push:
    branches: [ "main" ]
  # Actions › Deploy Garap Backend › Run workflow: deploy by hand, optionally resetting the database.
  workflow_dispatch:
    inputs:
      seed:
        description: "Kosongkan database: MENGHAPUS semua data, hanya akun Owner (secret OWNER_*) yang tersisa"
        type: boolean
        default: false
      demo:
        description: "Isi data demo (MENGHAPUS semua data di database)"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "src,package.json,package-lock.json,Containerfile,.dockerignore,prisma,prisma.config.ts,tsconfig.json,tsconfig.scripts.json,nest-cli.json"
          target: "/home/dev/backend/garap-be"
          overwrite: true
          # Start from a clean folder so files deleted in the repo (e.g. old modules) do not linger.
          rm: true

      - name: Write .env
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cat > /home/dev/backend/garap-be/.env <<'ENV_EOF'
            ${{ secrets.ENV_FILE }}
            ENV_EOF
            chmod 600 /home/dev/backend/garap-be/.env

      - name: Build & Restart (Podman)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          command_timeout: 20m
          script: |
            set -e
            cd /home/dev/backend/garap-be

            podman build -t garap-be:latest -f Containerfile .

            # --network=host so this container (running as user "dev") can reach
            # Postgres on 127.0.0.1:5432, which is owned/started by user "admin".
            podman run --rm \
              --network=host \
              --env-file .env \
              garap-be:latest \
              npx prisma migrate deploy

            # Posisi, izin, dan akun Owner pertama. Aman diulang: Owner hanya dibuat bila belum ada.
            # Isi secret OWNER_EMAIL, OWNER_NAME, OWNER_PASSWORD untuk deploy pertama; boleh dihapus sesudahnya.
            umask 077
            cat > .owner.env <<'OWNER_EOF'
            OWNER_EMAIL=${{ secrets.OWNER_EMAIL }}
            OWNER_NAME=${{ secrets.OWNER_NAME }}
            OWNER_PASSWORD=${{ secrets.OWNER_PASSWORD }}
            OWNER_EOF
            podman run --rm \
              --network=host \
              --env-file .env \
              --env-file .owner.env \
              garap-be:latest \
              npm run prisma:init:prod || echo "⚠️  Owner belum dibuat: isi secret OWNER_EMAIL, OWNER_NAME, OWNER_PASSWORD"

            # Hanya bila diminta (Run workflow › seed / demo): kedua seeder MENGHAPUS semua tabel.
            # seed = database kosong + akun Owner dari secret OWNER_* (default: bhagaskuro); demo = data demo.
            if [ "${{ github.event.inputs.demo }}" = "true" ]; then
              podman run --rm \
                --network=host \
                --env-file .env \
                -e SEED_CONFIRM=yes \
                garap-be:latest \
                npm run prisma:seed:demo:prod
            elif [ "${{ github.event.inputs.seed }}" = "true" ]; then
              podman run --rm \
                --network=host \
                --env-file .env \
                --env-file .owner.env \
                -e SEED_CONFIRM=yes \
                garap-be:latest \
                npm run prisma:seed:prod
            fi
            rm -f .owner.env

            podman stop garap-be 2>/dev/null || true
            podman rm garap-be 2>/dev/null || true

            # Lampiran disimpan di R2 (STORAGE_DRIVER=s3); volume ini hanya untuk file sementara / STORAGE_DRIVER=local.
            podman run -d \
              --name garap-be \
              --network=host \
              --env-file .env \
              -v garap-uploads:/app/uploads \
              --restart=always \
              garap-be:latest

            # Tunggu API sehat (http://127.0.0.1:3001/api/v1/health) sebelum menyatakan deploy berhasil.
            API_PORT=$(sed -n 's/^PORT=//p' .env | tr -d '[:space:]')
            API_PORT=${API_PORT:-3001}
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${API_PORT}/api/v1/health" >/dev/null 2>&1; then
                echo "✅ garap-be sehat"; break
              fi
              if [ "$i" = 30 ]; then echo "❌ garap-be tidak sehat"; podman logs --tail 80 garap-be; exit 1; fi
              sleep 2
            done

            podman image prune -f
